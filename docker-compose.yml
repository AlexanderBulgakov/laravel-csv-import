services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./src:/var/www/html
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DB:-laravel}
      DB_USERNAME: ${MYSQL_USER:-laravel}
      DB_PASSWORD: ${MYSQL_PASSWORD:-secret}
      REDIS_HOST: valkey
      REDIS_PORT: 6379
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_started
    # php-fpm is started by `exec "$@"` at the very end of entrypoint.sh, so an open
    # port 9000 means bootstrap (create-project, composer install, key:generate) is done.
    # Don't replace this with a file check like vendor/autoload.php: it appears before
    # key:generate runs, and dependents would race on APP_KEY.
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 300s

  queue-worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan queue:work redis --tries=3 --timeout=60
    restart: unless-stopped
    volumes:
      - ./src:/var/www/html
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DB:-laravel}
      DB_USERNAME: ${MYSQL_USER:-laravel}
      DB_PASSWORD: ${MYSQL_PASSWORD:-secret}
      REDIS_HOST: valkey
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      SKIP_BOOTSTRAP: "1"
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
      valkey:
        condition: service_started

  nginx:
    image: nginx:alpine
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./src:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  db:
    image: mysql:5.7
    environment:
      MYSQL_DATABASE: ${MYSQL_DB:-laravel}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-secret}
      MYSQL_USER: ${MYSQL_USER:-laravel}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secret}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${MYSQL_USER:-laravel}", "-p${MYSQL_PASSWORD:-secret}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "3306:3306"

  valkey:
    image: valkey/valkey:8-alpine

  node:
    image: node:18-alpine
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    depends_on:
      app:
        condition: service_healthy
    # Laravel 8 ships Laravel Mix (webpack), not Vite. Polling because inotify events
    # don't reliably cross the Docker Desktop bind mount.
    command: sh -c "npm install && npm run watch-poll"
  
  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
